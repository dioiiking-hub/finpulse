<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8A94E" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#D8A94E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- base disc -->
  <circle cx="48" cy="48" r="44" fill="#10161E"/>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#D8A94E" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- concentric rings -->
  <circle cx="48" cy="48" r="31" fill="none" stroke="#D8A94E" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="48" cy="48" r="18" fill="none" stroke="#D8A94E" stroke-opacity="0.3" stroke-width="1"/>
  <!-- 45 deg scan sector -->
  <path d="M48 48 L48 4 A44 44 0 0 1 92 48 Z" fill="url(#scan)"/>
  <!-- ECG pulse line through center -->
  <polyline points="8,48 26,48 33,48 38,30 44,64 49,22 55,58 60,44 64,48 88,48"
            fill="none" stroke="#D8A94E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- hit hotspot, upper-right quadrant -->
  <circle cx="66" cy="27" r="3.2" fill="#E5484D"/>
  <circle cx="66" cy="27" r="6" fill="none" stroke="#E5484D" stroke-opacity="0.45" stroke-width="1"/>
</svg>
